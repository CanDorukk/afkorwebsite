<!DOCTYPE html>
<html class="light" lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saha ve Etkinlik Galerisi | AFKOR</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/assets/js/tailwind.config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col" data-active="medya">
<div id="site-header"></div>
<!-- Main Content -->
<main class="flex-grow">
<section class="w-full bg-surface border-b border-outline-variant">
<div class="w-full max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-stack-lg flex flex-col gap-stack-sm">
<nav class="flex flex-wrap items-center gap-2 font-label-sm text-label-sm text-on-surface-variant">
<a class="hover:text-primary transition-colors" href="/">Anasayfa</a>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<a class="hover:text-primary transition-colors" href="/medya/basin/">Medya</a>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<span class="text-on-surface font-medium">Galeri</span>
</nav>
<h1 class="font-headline-lg md:font-headline-xl text-headline-lg md:text-headline-xl text-primary-container">Saha ve Etkinlik Galerisi</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-3xl">Ulusal Afet Koordinasyon Derneği'nin sahada yürüttüğü çalışmalar, tatbikatlar ve lojistik destek faaliyetlerinin görsel arşivi.</p>
</div>
</section>
<div class="w-full max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-stack-lg space-y-stack-lg">
<!-- Media Type Toggle (Filter) -->
<section class="flex flex-wrap gap-3">
<button type="button" class="gallery-filter px-6 py-2 rounded-full border border-secondary-container bg-secondary-container text-on-primary text-label-md font-label-md transition-all" data-filter="all">Tümü</button>
<button type="button" class="gallery-filter px-6 py-2 rounded-full border border-outline hover:border-primary-container text-on-surface-variant hover:text-primary-container text-label-md font-label-md transition-all" data-filter="foto">Fotoğraf Galerisi</button>
<button type="button" class="gallery-filter px-6 py-2 rounded-full border border-outline hover:border-primary-container text-on-surface-variant hover:text-primary-container text-label-md font-label-md transition-all" data-filter="video">Video Galerisi</button>
</section>
<!-- Masonry Gallery Grid -->
<p class="gallery-empty font-body-md text-body-md text-on-surface-variant py-stack-lg" hidden>Bu kategoride içerik yakında eklenecektir.</p>
<section class="masonry-grid">
<!-- Item 1: Photo -->
<div class="masonry-item relative group rounded-lg overflow-hidden border border-outline-variant bg-surface shadow-sm hover:shadow-md transition-shadow" data-cat="foto">
<img class="w-full h-auto object-cover" src="/assets/img/etkinlik-1.webp" alt="AFKOR saha etkinliği" loading="lazy">
<div class="absolute bottom-4 left-4 bg-surface text-on-surface px-3 py-1 rounded text-label-sm font-label-sm flex items-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-[16px] text-secondary-container">groups</span>
                    Saha Etkinliği
                </div>
</div>
<!-- Item 2: Photo -->
<div class="masonry-item relative group rounded-lg overflow-hidden border border-outline-variant bg-surface shadow-sm hover:shadow-md transition-shadow" data-cat="foto">
<img class="w-full h-auto object-cover" src="/assets/img/etkinlik-2.webp" alt="AFKOR saha etkinliği" loading="lazy">
<div class="absolute bottom-4 left-4 bg-surface text-on-surface px-3 py-1 rounded text-label-sm font-label-sm flex items-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-[16px] text-secondary-container">groups</span>
                    Saha Etkinliği
                </div>
</div>
</section>
</div>
</main>
<!-- Footer -->
<div id="site-footer"></div>
<script src="/assets/js/site.js"></script>
</body>
</html>
