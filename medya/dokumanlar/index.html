<!DOCTYPE html>
<html class="light" lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dökümanlar | AFKOR</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/assets/js/tailwind.config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col" data-active="medya">
<div id="site-header"></div>
<!-- Main Content -->
<main class="flex-grow">
<section class="w-full bg-surface border-b border-outline-variant">
<div class="w-full max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-stack-lg flex flex-col gap-stack-sm">
<nav class="flex flex-wrap items-center gap-2 font-label-sm text-label-sm text-on-surface-variant">
<a class="hover:text-primary transition-colors" href="/">Anasayfa</a>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<a class="hover:text-primary transition-colors" href="/medya/basin/">Medya</a>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<span class="text-on-surface font-medium">Dökümanlar</span>
</nav>
<h1 class="font-headline-lg md:font-headline-xl text-headline-lg md:text-headline-xl text-primary-container">Dökümanlar</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-3xl">Faaliyet raporları, mali tablolar, tüzük ve diğer kurumsal yayınlar.</p>
</div>
</section>
<div class="w-full max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-stack-lg space-y-stack-lg">
<!-- Document Section -->
<section class="py-stack-lg w-full max-w-[1280px] mx-auto">
<!-- Filters -->
<div class="flex flex-wrap gap-stack-sm mb-stack-lg">
<button class="px-4 py-2 bg-primary-container text-white border border-[#CBD5E1] rounded font-label-md text-label-md">Tüm Dökümanlar</button>
<button class="px-4 py-2 bg-transparent text-[#0F172A] border border-[#CBD5E1] rounded font-label-md text-label-md hover:bg-surface-variant transition-colors">Faaliyet Raporları</button>
<button class="px-4 py-2 bg-transparent text-[#0F172A] border border-[#CBD5E1] rounded font-label-md text-label-md hover:bg-surface-variant transition-colors">Denetim Raporları</button>
<button class="px-4 py-2 bg-transparent text-[#0F172A] border border-[#CBD5E1] rounded font-label-md text-label-md hover:bg-surface-variant transition-colors">Afet Bilinçlendirme Rehberleri</button>
<button class="px-4 py-2 bg-transparent text-[#0F172A] border border-[#CBD5E1] rounded font-label-md text-label-md hover:bg-surface-variant transition-colors">Dernek Tüzüğü</button>
</div>
<!-- Document Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter">
<!-- Card 1 -->
<div class="bg-surface-container-lowest border border-[#CBD5E1] rounded p-stack-md flex flex-col">
<div class="flex items-start justify-between mb-stack-sm">
<div class="bg-surface-variant p-3 rounded flex items-center justify-center">
<span class="material-symbols-outlined text-[#F97316] text-[32px]">picture_as_pdf</span>
</div>
<div class="flex flex-col items-end space-y-1">
<span class="bg-surface-container px-2 py-1 rounded text-label-sm font-label-sm text-on-surface-variant">2023</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">4.2 MB</span>
</div>
</div>
<h3 class="text-headline-md font-headline-md text-on-surface mb-stack-sm flex-grow">2023 Faaliyet Raporu</h3>
<button class="w-full mt-auto border border-[#1E293B] text-[#1E293B] hover:bg-primary-container hover:text-white transition-colors py-2 rounded font-label-md text-label-md flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-[20px]">download</span> PDF İndir
                    </button>
</div>
<!-- Card 2 -->
<div class="bg-surface-container-lowest border border-[#CBD5E1] rounded p-stack-md flex flex-col">
<div class="flex items-start justify-between mb-stack-sm">
<div class="bg-surface-variant p-3 rounded flex items-center justify-center">
<span class="material-symbols-outlined text-[#F97316] text-[32px]">picture_as_pdf</span>
</div>
<div class="flex flex-col items-end space-y-1">
<span class="bg-surface-container px-2 py-1 rounded text-label-sm font-label-sm text-on-surface-variant">2023</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">2.1 MB</span>
</div>
</div>
<h3 class="text-headline-md font-headline-md text-on-surface mb-stack-sm flex-grow">Afet Hazırlık Rehberi</h3>
<button class="w-full mt-auto border border-[#1E293B] text-[#1E293B] hover:bg-primary-container hover:text-white transition-colors py-2 rounded font-label-md text-label-md flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-[20px]">download</span> PDF İndir
                    </button>
</div>
<!-- Card 3 -->
<div class="bg-surface-container-lowest border border-[#CBD5E1] rounded p-stack-md flex flex-col">
<div class="flex items-start justify-between mb-stack-sm">
<div class="bg-surface-variant p-3 rounded flex items-center justify-center">
<span class="material-symbols-outlined text-[#F97316] text-[32px]">picture_as_pdf</span>
</div>
<div class="flex flex-col items-end space-y-1">
<span class="bg-surface-container px-2 py-1 rounded text-label-sm font-label-sm text-on-surface-variant">2022</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">3.8 MB</span>
</div>
</div>
<h3 class="text-headline-md font-headline-md text-on-surface mb-stack-sm flex-grow">2022 Faaliyet Raporu</h3>
<button class="w-full mt-auto border border-[#1E293B] text-[#1E293B] hover:bg-primary-container hover:text-white transition-colors py-2 rounded font-label-md text-label-md flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-[20px]">download</span> PDF İndir
                    </button>
</div>
</div>
</section>
</div>
</main>
<!-- Footer -->
<div id="site-footer"></div>
<script src="/assets/js/site.js"></script>
</body>
</html>
